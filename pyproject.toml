[project]
name = "mineracao-de-dados-spaceship-titanic"
version = "0.1.0"
description = "Análise e modelagem da base Spaceship Titanic para o trabalho de Mineração de Dados."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.63.0",
    "joblib==1.5.3",
    "kiwisolver==1.5.0",
    "matplotlib==3.10.9",
    "numpy==2.4.6",
    "optuna==3.1.0",
    "packaging==26.2",
    "pandas==3.0.3",
    "pillow==12.2.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "seaborn==0.13.2",
    "six==1.17.0",
    "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
notebooks = [
    "notebook>=7",
]

[tool.uv]
package = false
